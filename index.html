<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florería Boutique | Arreglos Únicos</title>
    
    <!-- Tipografías de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* --- VARIABLES DE DISEÑO --- */
        :root {
            --bg-primary: #FAF7F2;
            --bg-card: #FFFFFF;
            --accent-main: #2E4036;    /* Verde botánico profundo */
            --accent-soft: #EAE3D9;    /* Tono crema suave */
            --rose-accent: #D98880;    /* Rosa floral sofisticado */
            --rose-bg: #FDF5F3;        /* Fondo claro rosa */
            --text-dark: #1C2421;
            --text-muted: #66706A;
            --border-color: #E8E2D9;
            --shadow-sm: 0 2px 8px rgba(28, 36, 33, 0.04);
            --shadow-lg: 0 12px 32px rgba(28, 36, 33, 0.12);
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-full: 999px;
            --font-title: 'Playfair Display', Georgia, serif;
            --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        /* --- RESET & BASICS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-dark);
            font-family: var(--font-body);
            line-height: 1.5;
            padding-bottom: 80px;
        }

        img {
            max-width: 100%;
            display: block;
            object-fit: cover;
        }

        button {
            font-family: inherit;
            border: none;
            cursor: pointer;
            outline: none;
        }

        /* --- NAVEGACIÓN SUPERIOR --- */
        .header {
            position: sticky;
            top: 0;
            background: rgba(250, 247, 242, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            font-family: var(--font-title);
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--accent-main);
            letter-spacing: -0.5px;
        }

        .cart-trigger {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            width: 44px;
            height: 44px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--rose-accent);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-primary);
        }

        /* --- HERO SECTION --- */
        .hero {
            padding: 24px 20px 16px;
        }

        .hero-tag {
            display: inline-block;
            background: var(--rose-bg);
            color: var(--rose-accent);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: var(--radius-full);
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        .hero h1 {
            font-family: var(--font-title);
            font-size: 2.1rem;
            line-height: 1.2;
            color: var(--accent-main);
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* --- FILTROS DE CATÁLOGO --- */
        .categories-wrapper {
            padding: 12px 20px 20px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .categories-wrapper::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            display: inline-block;
            background: var(--bg-card);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 600;
            margin-right: 8px;
            border: 1px solid var(--border-color);
            transition: all 0.25s ease;
        }

        .filter-btn.active {
            background: var(--accent-main);
            color: #FFFFFF;
            border-color: var(--accent-main);
            box-shadow: 0 4px 12px rgba(46, 64, 54, 0.2);
        }

        /* --- CATÁLOGO DE PRODUCTOS --- */
        .catalog {
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 768px) {
            .catalog {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 24px;
                padding: 0 40px;
            }
            .hero {
                padding: 40px 40px 24px;
                max-width: 800px;
            }
            .categories-wrapper {
                padding: 12px 40px 24px;
            }
        }

        .product-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 125%;
            background: var(--accent-soft);
        }

        .product-img-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .product-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            color: var(--accent-main);
        }

        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .product-price {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-main);
            margin-bottom: 12px;
        }

        .add-btn {
            width: 100%;
            background: var(--accent-soft);
            color: var(--accent-main);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
            margin-top: auto;
        }

        .add-btn:active {
            background: var(--accent-main);
            color: white;
        }

        /* --- BARRA / BOTÓN WHATSAPP COMPACTO --- */
        .bottom-action-bar {
            position: fixed;
            bottom: 16px;
            left: 20px;
            right: 20px;
            z-index: 90;
            display: flex;
            justify-content: flex-end;
            pointer-events: none;
        }

        .wsp-compact-btn {
            pointer-events: auto;
            background: #25D366;
            color: white;
            padding: 10px 16px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
            text-decoration: none;
            transition: transform 0.2s;
        }

        .wsp-compact-btn:active {
            transform: scale(0.95);
        }

        /* --- DRAWER DEL CARRITO --- */
        .cart-drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .cart-drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .cart-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 85vh;
            background: var(--bg-primary);
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
            z-index: 201;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
        }

        .cart-drawer-overlay.open .cart-drawer {
            transform: translateY(0);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-header h2 {
            font-family: var(--font-title);
            font-size: 1.4rem;
            color: var(--accent-main);
        }

        .close-cart {
            background: none;
            font-size: 1.5rem;
            color: var(--text-muted);
        }

        .cart-items-list {
            flex-grow: 1;
            overflow-y: auto;
            margin: 16px 0;
            max-height: 40vh;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            padding: 12px;
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .cart-item-details h4 {
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .cart-item-details p {
            font-size: 0.85rem;
            color: var(--accent-main);
            font-weight: 700;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-primary);
            padding: 4px 8px;
            border-radius: var(--radius-full);
        }

        .qty-btn {
            background: none;
            font-weight: 700;
            color: var(--text-dark);
            width: 24px;
            height: 24px;
        }

        .cart-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--accent-main);
        }

        .checkout-wsp-btn {
            width: 100%;
            background: #25D366;
            color: white;
            padding: 16px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.3);
        }

        .empty-cart-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- NAVEGACIÓN SUPERIOR -->
    <header class="header">
        <div class="brand-logo">Petals & Co.</div>
        <button class="cart-trigger" id="openCartBtn" aria-label="Ver Carrito">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E4036" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            <span class="cart-badge" id="cartCount">0</span>
        </button>
    </header>

    <!-- ENCABEZADO Y PRESENTACIÓN -->
    <section class="hero">
        <span class="hero-tag">✿ Flores frescas del día</span>
        <h1>Diseños florales para momentos memorables</h1>
        <p>Seleccionamos las mejores flores y armamos tu pedido al momento. Entrega a domicilio hoy mismo.</p>
    </section>

    <!-- FILTROS DE CATEGORÍA -->
    <nav class="categories-wrapper">
        <button class="filter-btn active" onclick="filterProducts('todos', this)">Todos</button>
        <button class="filter-btn" onclick="filterProducts('ramos', this)">Ramos Top</button>
        <button class="filter-btn" onclick="filterProducts('cajas', this)">Cajas Luxury</button>
        <button class="filter-btn" onclick="filterProducts('ocasiones', this)">Aniversario</button>
    </nav>

    <!-- CONTENEDOR DE PRODUCTOS -->
    <main class="catalog" id="catalogContainer">
        <!-- Renderizado dinámico vía Javascript -->
    </main>

    <!-- BOTÓN WHATSAPP FLOTANTE DISCRETO -->
    <div class="bottom-action-bar">
        <a href="#" id="wspGlobalBtn" class="wsp-compact-btn" target="_blank" aria-label="Contacto WhatsApp">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.012 2c-5.506 0-9.989 4.478-9.99 9.984 0 1.762.459 3.48 1.333 5.001L2 22l5.129-1.343c1.472.805 3.134 1.228 4.88 1.229h.004c5.505 0 9.988-4.478 9.989-9.985 0-2.668-1.039-5.176-2.926-7.062A9.925 9.925 0 0 0 12.012 2z"/></svg>
            <span>WhatsApp</span>
        </a>
    </div>

    <!-- DRAWER DEL CARRITO DE COMPRAS -->
    <div class="cart-drawer-overlay" id="cartOverlay">
        <div class="cart-drawer">
            <div class="cart-header">
                <h2>Tu Pedido</h2>
                <button class="close-cart" id="closeCartBtn">&times;</button>
            </div>
            
            <div class="cart-items-list" id="cartItemsList">
                <!-- Se llena dinámicamente -->
            </div>

            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total estimado:</span>
                    <span id="cartTotalAmount">$0.00</span>
                </div>
                <button class="checkout-wsp-btn" id="sendWspCheckout">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.012 2c-5.506 0-9.989 4.478-9.99 9.984 0 1.762.459 3.48 1.333 5.001L2 22l5.129-1.343c1.472.805 3.134 1.228 4.88 1.229h.004c5.505 0 9.988-4.478 9.989-9.985 0-2.668-1.039-5.176-2.926-7.062A9.925 9.925 0 0 0 12.012 2z"/></svg>
                    Confirmar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- LÓGICA DE LA APLICACIÓN -->
    <script>
        const PHONE_NUMBER = "584120000000"; 

        const products = [
            {
                id: 1,
                name: "Ramo Silvestre Velvet",
                category: "ramos",
                price: 35.00,
                tag: "Más vendido",
                image: "https://images.unsplash.com/photo-1561181286-d3fee7d55364?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 2,
                name: "Caja Luxury Rosas Pastel",
                category: "cajas",
                price: 50.00,
                tag: "Exclusivo",
                image: "https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 3,
                name: "Arreglo Romántico Tulipanes",
                category: "ocasiones",
                price: 42.00,
                tag: "Edición Limitada",
                image: "https://images.unsplash.com/photo-1520763185298-1b434c919102?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 4,
                name: "Bouquet Girasoles Solsticio",
                category: "ramos",
                price: 28.00,
                tag: "Fresco",
                image: "https://images.unsplash.com/photo-1597848212624-a19eb35e2651?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 5,
                name: "Caja Corazón & Hortensias",
                category: "cajas",
                price: 65.00,
                tag: "Premium",
                image: "https://images.unsplash.com/photo-1563241527-3004b7be0ffd?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 6,
                name: "Ramo Blanco Pureza",
                category: "ocasiones",
                price: 38.00,
                tag: "Elegante",
                image: "https://images.unsplash.com/photo-1582794543139-8ac9cb0f7b11?auto=format&fit=crop&w=600&q=80"
            }
        ];

        let cart = [];

        function renderProducts(items) {
            const container = document.getElementById('catalogContainer');
            container.innerHTML = '';

            items.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img-wrapper">
                        <span class="product-tag">${product.tag}</span>
                        <img src="${product.image}" alt="${product.name}" loading="lazy">
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">${product.name}</h3>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                        <button class="add-btn" onclick="addToCart(${product.id})">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            Agregar
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterProducts(category, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            if (category === 'todos') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartUI();
            if (navigator.vibrate) navigator.vibrate(40);
        }

        function changeQuantity(productId, delta) {
            const item = cart.find(p => p.id === productId);
            if (!item) return;

            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(p => p.id !== productId);
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartCountEl = document.getElementById('cartCount');
            const cartListEl = document.getElementById('cartItemsList');
            const cartTotalEl = document.getElementById('cartTotalAmount');

            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCountEl.textContent = totalItems;

            if (cart.length === 0) {
                cartListEl.innerHTML = '<div class="empty-cart-msg">Tu carrito está vacío 🌸</div>';
                cartTotalEl.textContent = '$0.00';
                return;
            }

            cartListEl.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                const itemEl = document.createElement('div');
                itemEl.className = 'cart-item';
                itemEl.innerHTML = `
                    <div class="cart-item-details">
                        <h4>${item.name}</h4>
                        <p>$${(item.price * item.quantity).toFixed(2)}</p>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQuantity(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button class="qty-btn" onclick="changeQuantity(${item.id}, 1)">+</button>
                    </div>
                `;
                cartListEl.appendChild(itemEl);
            });

            cartTotalEl.textContent = `$${total.toFixed(2)}`;
        }

        function sendCartToWhatsApp() {
            if (cart.length === 0) {
                alert("Por favor añade al menos un producto al carrito.");
                return;
            }

            let message = "Hola! 🌸 Quisiera realizar el siguiente pedido:\n\n";
            let total = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                message += `${index + 1}. *${item.name}* x${item.quantity} - $${itemTotal.toFixed(2)}\n`;
            });

            message += `\n*Total a pagar: $${total.toFixed(2)}*`;
            message += "\n\n¿Tienen disponibilidad y entregas para hoy?";

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodedMessage}`, '_blank');
        }

        document.getElementById('openCartBtn').addEventListener('click', () => {
            document.getElementById('cartOverlay').classList.add('open');
        });

        document.getElementById('closeCartBtn').addEventListener('click', () => {
            document.getElementById('cartOverlay').classList.remove('open');
        });

        document.getElementById('cartOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'cartOverlay') {
                document.getElementById('cartOverlay').classList.remove('open');
            }
        });

        document.getElementById('sendWspCheckout').addEventListener('click', sendCartToWhatsApp);

        document.getElementById('wspGlobalBtn').href = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent('Hola! Me gustaría información sobre sus arreglos florales.')}`;

        renderProducts(products);
    </script>
</body>
</html>
