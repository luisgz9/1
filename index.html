<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petals & Co. | Florería Boutique</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Tipografías de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* --- ESTILOS PERSONALIZADOS SOBRE BOOTSTRAP --- */
        :root {
            --bg-primary: #FAF7F2;
            --bg-card: #FFFFFF;
            --accent-main: #2E4036;
            --accent-soft: #EAE3D9;
            --rose-accent: #D98880;
            --rose-bg: #FDF5F3;
            --text-dark: #1C2421;
            --text-muted: #66706A;
            --border-color: #E8E2D9;
            --font-title: 'Playfair Display', Georgia, serif;
            --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-dark);
            font-family: var(--font-body);
            padding-bottom: 80px;
        }

        .font-title {
            font-family: var(--font-title);
        }

        /* Header Estilizado */
        .header-nav {
            background: rgba(250, 247, 242, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            font-family: var(--font-title);
            font-size: 1.4rem;
            color: var(--accent-main);
            font-weight: 600;
        }

        /* Hero */
        .hero-tag {
            background: var(--rose-bg);
            color: var(--rose-accent);
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Carrusel */
        .carousel-item img {
            height: 220px;
            object-fit: cover;
            border-radius: 16px;
        }

        @media (min-width: 768px) {
            .carousel-item img {
                height: 380px;
            }
        }

        /* Filtros horizontales scrolleables en móvil */
        .categories-scroll {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            gap: 8px;
        }
        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .btn-filter {
            background-color: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 50rem;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 18px;
            transition: all 0.2s ease;
        }

        .btn-filter.active {
            background-color: var(--accent-main);
            color: #ffffff;
            border-color: var(--accent-main);
        }

        /* Cards de productos */
        .card-product {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        
        .card-product:active {
            transform: scale(0.98);
        }

        .product-img-wrapper {
            position: relative;
            padding-top: 110%;
            background: var(--accent-soft);
        }

        .product-img-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            color: var(--accent-main);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .btn-add-cart {
            background-color: var(--accent-soft);
            color: var(--accent-main);
            font-weight: 600;
            font-size: 0.85rem;
            border: none;
            border-radius: 10px;
        }

        .btn-add-cart:active {
            background-color: var(--accent-main);
            color: white;
        }

        /* Botón Flotante Discreto de WhatsApp */
        .wsp-float-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background-color: #25D366;
            color: white;
            border-radius: 50rem;
            padding: 10px 18px;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.35);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .wsp-float-btn:active {
            transform: scale(0.95);
            color: white;
        }

        /* Modal/Offcanvas Carrito */
        .offcanvas-bottom {
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            height: 80vh !important;
            background-color: var(--bg-primary);
        }

        .btn-wsp-checkout {
            background-color: #25D366;
            color: white;
            font-weight: 700;
            border-radius: 50rem;
        }
    </style>
</head>
<body>

    <!-- NAVEGACIÓN SUPERIOR -->
    <header class="header-nav sticky-top py-3 px-3">
        <div class="container d-flex justify-content-between align-items-center p-0">
            <span class="brand-logo">Petals & Co.</span>
            <button class="btn btn-outline-secondary position-relative rounded-circle p-2 d-flex align-items-center justify-content-center" 
                    style="width: 42px; height: 42px; border-color: var(--border-color); background: white;" 
                    type="button" 
                    data-bs-toggle="offcanvas" 
                    data-bs-target="#cartOffcanvas">
                <i class="bi bi-bag text-dark"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill" 
                      id="cartCount" 
                      style="background-color: var(--rose-accent);">0</span>
            </button>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="container mt-4 px-3">
        <span class="badge hero-tag px-3 py-2 rounded-pill mb-2">✿ Flores frescas del día</span>
        <h1 class="font-title display-6 fw-bold text-dark mb-2">Diseños florales para momentos memorables</h1>
        <p class="text-muted small">Seleccionamos las mejores flores y armamos tu pedido al momento con entrega hoy mismo.</p>
    </section>

    <!-- CARRUSEL DESTACADO -->
    <section class="container my-3 px-3">
        <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active" aria-current="true"></button>
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2"></button>
            </div>
            <div class="carousel-inner shadow-sm">
                <div class="carousel-item active" data-bs-interval="3500">
                    <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=1000&q=80" class="d-block w-100" alt="Colección Edición Especial">
                    <div class="carousel-caption d-block text-start bg-dark bg-opacity-50 rounded-3 p-2 px-3 mb-2 mx-2">
                        <small class="text-white fw-bold">Colección de Temporada</small>
                    </div>
                </div>
                <div class="carousel-item" data-bs-interval="3500">
                    <img src="https://images.unsplash.com/photo-1563241527-3004b7be0ffd?auto=format&fit=crop&w=1000&q=80" class="d-block w-100" alt="Cajas de Rosas Luxury">
                    <div class="carousel-caption d-block text-start bg-dark bg-opacity-50 rounded-3 p-2 px-3 mb-2 mx-2">
                        <small class="text-white fw-bold">Cajas Luxury para Regalo</small>
                    </div>
                </div>
                <div class="carousel-item" data-bs-interval="3500">
                    <img src="https://images.unsplash.com/photo-1520763185298-1b434c919102?auto=format&fit=crop&w=1000&q=80" class="d-block w-100" alt="Arreglos Románticos">
                    <div class="carousel-caption d-block text-start bg-dark bg-opacity-50 rounded-3 p-2 px-3 mb-2 mx-2">
                        <small class="text-white fw-bold">Detalles para Aniversarios</small>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- FILTROS DE CATEGORÍA -->
    <section class="container my-3 px-3">
        <div class="categories-scroll pb-2">
            <button class="btn btn-filter active" onclick="filterProducts('todos', this)">Todos</button>
            <button class="btn btn-filter" onclick="filterProducts('ramos', this)">Ramos Top</button>
            <button class="btn btn-filter" onclick="filterProducts('cajas', this)">Cajas Luxury</button>
            <button class="btn btn-filter" onclick="filterProducts('ocasiones', this)">Aniversario</button>
        </div>
    </section>

    <!-- CATÁLOGO DE PRODUCTOS -->
    <main class="container px-3">
        <div class="row g-3" id="catalogContainer">
            <!-- Renderizado dinámico vía JavaScript -->
        </div>
    </main>

    <!-- BOTÓN WHATSAPP FLOTANTE DISCRETO -->
    <a href="#" id="wspGlobalBtn" class="wsp-float-btn" target="_blank" aria-label="Contacto WhatsApp">
        <i class="bi bi-whatsapp fs-6"></i>
        <span>WhatsApp</span>
    </a>

    <!-- OFFCANVAS CARRITO (Estilo Modal Deslizante Móvil) -->
    <div class="offcanvas offcanvas-bottom" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title font-title text-success-emphasis fw-bold" id="cartOffcanvasLabel">Tu Pedido</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column justify-content-between">
            <div id="cartItemsList" class="overflow-y-auto pe-1" style="max-height: 50vh;">
                <!-- Se llena dinámicamente -->
            </div>
            
            <div class="border-top pt-3 mt-2">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-bold">Total estimado:</span>
                    <span class="fw-bold fs-5 text-success" id="cartTotalAmount">$0.00</span>
                </div>
                <button class="btn btn-wsp-checkout w-py-3 w-100 py-3 d-flex align-items-center justify-content-center gap-2" id="sendWspCheckout">
                    <i class="bi bi-whatsapp fs-5"></i>
                    <span>Confirmar Pedido por WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- LÓGICA DE LA APLICACIÓN -->
    <script>
        const PHONE_NUMBER = "584120000000"; 

        const products = [
            {
                id: 1,
                name: "Ramo Silvestre Velvet",
                category: "ramos",
                price: 35.00,
                tag: "Más vendido",
                image: "https://images.unsplash.com/photo-1561181286-d3fee7d55364?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 2,
                name: "Caja Luxury Rosas Pastel",
                category: "cajas",
                price: 50.00,
                tag: "Exclusivo",
                image: "https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 3,
                name: "Arreglo Romántico Tulipanes",
                category: "ocasiones",
                price: 42.00,
                tag: "Edición Limitada",
                image: "https://images.unsplash.com/photo-1520763185298-1b434c919102?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 4,
                name: "Bouquet Girasoles Solsticio",
                category: "ramos",
                price: 28.00,
                tag: "Fresco",
                image: "https://images.unsplash.com/photo-1597848212624-a19eb35e2651?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 5,
                name: "Caja Corazón & Hortensias",
                category: "cajas",
                price: 65.00,
                tag: "Premium",
                image: "https://images.unsplash.com/photo-1563241527-3004b7be0ffd?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 6,
                name: "Ramo Blanco Pureza",
                category: "ocasiones",
                price: 38.00,
                tag: "Elegante",
                image: "https://images.unsplash.com/photo-1582794543139-8ac9cb0f7b11?auto=format&fit=crop&w=600&q=80"
            }
        ];

        let cart = [];

        function renderProducts(items) {
            const container = document.getElementById('catalogContainer');
            container.innerHTML = '';

            items.forEach(product => {
                const col = document.createElement('div');
                col.className = 'col-6 col-md-4 col-lg-3';
                col.innerHTML = `
                    <div class="card-product h-100 d-flex flex-column justify-content-between p-2">
                        <div>
                            <div class="product-img-wrapper rounded-3 mb-2">
                                <span class="badge-tag">${product.tag}</span>
                                <img src="${product.image}" alt="${product.name}" loading="lazy">
                            </div>
                            <h3 class="h6 text-dark mb-1 fw-semibold">${product.name}</h3>
                            <p class="fw-bold text-success mb-2">$${product.price.toFixed(2)}</p>
                        </div>
                        <button class="btn btn-add-cart w-100 py-2 d-flex align-items-center justify-content-center gap-1" onclick="addToCart(${product.id})">
                            <i class="bi bi-plus-lg"></i> Agregar
                        </button>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        function filterProducts(category, btnElement) {
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            if (category === 'todos') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartUI();
            if (navigator.vibrate) navigator.vibrate(40);
        }

        function changeQuantity(productId, delta) {
            const item = cart.find(p => p.id === productId);
            if (!item) return;

            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(p => p.id !== productId);
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartCountEl = document.getElementById('cartCount');
            const cartListEl = document.getElementById('cartItemsList');
            const cartTotalEl = document.getElementById('cartTotalAmount');

            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCountEl.textContent = totalItems;

            if (cart.length === 0) {
                cartListEl.innerHTML = '<p class="text-center text-muted py-4">Tu carrito está vacío 🌸</p>';
                cartTotalEl.textContent = '$0.00';
                return;
            }

            cartListEl.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                const itemEl = document.createElement('div');
                itemEl.className = 'd-flex justify-content-between align-items-center bg-white p-2 mb-2 rounded-3 border';
                itemEl.innerHTML = `
                    <div>
                        <h6 class="mb-0 text-dark small fw-semibold">${item.name}</h6>
                        <small class="text-success fw-bold">$${(item.price * item.quantity).toFixed(2)}</small>
                    </div>
                    <div class="d-flex align-items-center gap-2 bg-light px-2 py-1 rounded-pill border">
                        <button class="btn btn-sm p-0 fw-bold border-0" onclick="changeQuantity(${item.id}, -1)">-</button>
                        <span class="small fw-semibold">${item.quantity}</span>
                        <button class="btn btn-sm p-0 fw-bold border-0" onclick="changeQuantity(${item.id}, 1)">+</button>
                    </div>
                `;
                cartListEl.appendChild(itemEl);
            });

            cartTotalEl.textContent = `$${total.toFixed(2)}`;
        }

        function sendCartToWhatsApp() {
            if (cart.length === 0) {
                alert("Por favor añade al menos un producto al carrito.");
                return;
            }

            let message = "Hola! 🌸 Quisiera realizar el siguiente pedido:\n\n";
            let total = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                message += `${index + 1}. *${item.name}* x${item.quantity} - $${itemTotal.toFixed(2)}\n`;
            });

            message += `\n*Total a pagar: $${total.toFixed(2)}*`;
            message += "\n\n¿Tienen disponibilidad y entregas para hoy?";

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodedMessage}`, '_blank');
        }

        document.getElementById('sendWspCheckout').addEventListener('click', sendCartToWhatsApp);
        document.getElementById('wspGlobalBtn').href = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent('Hola! Me gustaría información sobre sus arreglos florales.')}`;

        renderProducts(products);
    </script>
</body>
</html>
